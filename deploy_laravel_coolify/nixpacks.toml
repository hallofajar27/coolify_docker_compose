# Nixpacks configuration for Laravel 12 / Inertia React on Coolify

[phases.setup]
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "php84Extensions.pdo",
  "php84Extensions.pdo_pgsql",
  "php84Extensions.mbstring",
  "php84Extensions.openssl",
  "php84Extensions.tokenizer",
  "php84Extensions.xml",
  "php84Extensions.curl",
  "php84Extensions.zip",
  "php84Extensions.bcmath",
  "php84Extensions.gmp",
  "nodejs_22"
]

[phases.install]
cmds = [
  "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-3000}"
